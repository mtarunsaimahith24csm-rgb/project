<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Student Performance Prediction
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">

        Student Performance AI

    </div>


    {% if session.get("username") %}

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('students') }}">
            Students
        </a>

        <a href="{{ url_for('add_student') }}">
            Add Student
        </a>
        <a href="{{ url_for('import_export') }}">
    Import / Export
</a>

        <a href="{{ url_for('predict') }}">
            Prediction
        </a>

        <a href="{{ url_for('analytics') }}">
            Analytics
        </a>
        <a href="{{ url_for('model_evaluation') }}">
            Model Evaluation
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

    {% endif %}

</nav>


<main class="container">

    {% block content %}

    {% endblock %}

</main>


<footer>

    <p>
        Student Performance Prediction System
    </p>

</footer>


</body>

</html>
